<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - MailGuard AI</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="analytics">
    <main>
        <h1>Analytics</h1>
        <p class="sub">Your email security at a glance.</p>
        <div class="grid" id="stats"></div>
        <div class="grid g2">
            <div class="card">
                <h3>Safe vs Spam</h3>
                <div class="ch">
                    <canvas id="pie"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Weekly Email Scans</h3>
                <div class="ch">
                    <canvas id="week"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Daily Scanning</h3>
                <div class="ch">
                    <canvas id="daily"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Monthly Analysis</h3>
                <div class="ch">
                    <canvas id="month"></canvas>
                </div>
            </div>
        </div>
    </main>
    <script src="https://jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
