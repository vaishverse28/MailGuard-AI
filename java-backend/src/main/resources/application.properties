# ---------- Server ----------
server.port=8081

# ---------- MySQL ----------
# createDatabaseIfNotExist=true => mailguard_db auto-create hoil jar nasel tar
spring.datasource.url=jdbc:mysql://localhost:3306/mailguard_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- AI Service (Member 3 - Python) ----------
ai.service.url=http://localhost:8000
# true = dummy/mock AI response (Member 3 chi service ready nasel tevha)
# false = real Python AI service call
ai.service.mock=false
ai.service.connect-timeout-ms=5000
ai.service.read-timeout-ms=30000

# ---------- JWT ----------
# Secret minimum 32 characters pahije. Production madhye env variable ne override kar.
jwt.secret=${JWT_SECRET:mailguard-ai-super-secret-key-change-me-2026}
jwt.expiration-ms=86400000

# ---------- CORS ----------
# VS Code Live Server = http://127.0.0.1:5500
cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
